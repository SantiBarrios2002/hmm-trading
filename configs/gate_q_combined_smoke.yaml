bucketed_transition:
  grid_size: 50
  n_buckets: 3
  smoothing: 1.0
continuous_iohmm:
  ess_bulk_threshold: 1
  num_chains: 2
  num_samples: 4
  num_warmup: 3
  rhat_threshold: 10.0
  seed: 0
  target_accept_prob: 0.8
cost_bps_per_turnover: 1.0
data:
  kind: csv
  path: tests/fixtures/es_1min_month.csv
frequency: 1min
notes: Gate Q tiny smoke run on the checked-in ES CSV fixture. Exercises the
  combined volatility-ratio plus intraday-seasonality HMC continuous IOHMM
  variant without running the full Databento benchmark.
seasonality:
  bucket_minutes: 1
  exchange_tz: America/Chicago
  normalize: true
sha256: c81161b1932361e119483a37fa27b2e16ce39020bcfcc3e871812c5cb7a9ca34
signal_policy: sign
signal_threshold: 0.0
spline:
  degree: 3
  demean: false
  demean_grid_size: 1000
  min_obs: 20
  n_knots: 5
vol_ratio:
  decay: 0.79
  fast_window: 50
  slow_window: 100
walk_forward:
  h_days: 10
  k_values:
  - 2
  min_variance: 1.0e-08
  n_iter: 100
  random_state: 0
  retrain_every_days: 5
  t_days: 5
  tol: 0.0001
  variance_floor_policy: clamp
