notes: 'Gate L P7 headline run (DMM-only subset: baseline anchor + dmm). num_epochs=50, forecast_lookback=500 (fixed-lag smoother: caps the O(T^2) expanding-prefix forecast to the last 500 bars -> O(T*W); verified numerically identical to the full prefix at W>=200 on this model, ~40-60x faster at the 1-min eval size). Skips HMC/bucketed/default variants via the variants field; those rows are reused from run d8b6e7eef6c2. Walk-forward matches d8b6e7eef6c2 (h_days=23, K=2, retrain=20, cost=1.0, sign). DMM fits on 5-min, forecasts/evaluates on 1-min. Headline run is multi-threaded; the single-thread repro tolerance (--torch-threads 1) is verified separately on one window.'
