name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch wheel first (the [dmm] extra can't pin the CPU index);
          # 2.12.1+cpu satisfies the extra's torch==2.12.1 pin.
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,dmm]"

      - name: Run Ruff
        run: ruff check .

      - name: Run Black check
        run: black --check .

      - name: Run tests
        run: pytest

      - name: Run mypy
        run: mypy src
